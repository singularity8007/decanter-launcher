<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d23"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0607f"/>
      <stop offset="1" stop-color="#8e1b3a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e9ec"/>
      <stop offset="1" stop-color="#c9b8be"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The stem: an I, standing on its own. -->
  <rect x="124" y="120" width="56" height="272" rx="28" fill="url(#stem)"/>
  <!-- The bowl: a backwards C, detached from the stem. -->
  <path d="M226 148H254A108 108 0 0 1 254 364H226" fill="none" stroke="url(#wine)" stroke-width="56" stroke-linecap="round"/>
</svg>
